name: Issue
description: Report a bug or request a docs, maintenance, or other non-feature change.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the problem or requested change.
    validations:
      required: true

  - type: textarea
    id: expected_result
    attributes:
      label: Expected Result
      description: Describe the outcome that would resolve this issue.
    validations:
      required: true
