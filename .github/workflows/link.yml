name: Poise Link

on:
  pull_request:
    paths:
      - 'link/**'
      - '.github/workflows/link.yml'
  push:
    branches: [main]
    # Path filters do not apply to tag pushes, so every link-v* tag builds installers.
    tags: ['link-v*']
    paths:
      - 'link/**'
      - '.github/workflows/link.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tauri's Linux build dependencies: the webview, the tray, icons and menus.
  LINUX_PACKAGES: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

jobs:
  check:
    name: Check and test (Linux)
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: link/src-tauri

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Tauri's Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES

      - name: Install the pinned Rust toolchain
        # Reads link/rust-toolchain.toml.
        run: rustup toolchain install

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: link/src-tauri

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  installers:
    name: Installers (${{ matrix.name }})
    # Multi-OS builds are costly: only on request or for a release tag.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/link-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            runner: macos-latest
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows
            runner: windows-latest
            args: --bundles msi,nsis
          - name: Linux
            runner: ubuntu-22.04
            args: --bundles deb,appimage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: link/package-lock.json

      - name: Install Tauri's Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES

      - name: Install the pinned Rust toolchain
        working-directory: link
        shell: bash
        run: |
          rustup toolchain install
          if [ -n "${{ matrix.rust-targets }}" ]; then rustup target add ${{ matrix.rust-targets }}; fi

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: link/src-tauri

      - name: Install the Tauri CLI
        working-directory: link
        run: npm ci

      # No tag or release inputs: the action only builds, and the installers are
      # uploaded as workflow artifacts. They are not code-signed yet.
      - name: Build installers
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: link
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: 'poise-link-[platform]-[arch]-[bundle]'
