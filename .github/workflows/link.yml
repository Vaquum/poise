name: Poise Link

on:
  pull_request:
    paths:
      - 'link/**'
      - '.github/workflows/link.yml'
  push:
    branches: [main]
    # Path filters do not apply to tag pushes, so every link-v* tag builds and publishes a release.
    tags: ['link-v*']
    paths:
      - 'link/**'
      - '.github/workflows/link.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event is part of the group, so a manual installer build and a push to
  # the same branch never cancel each other.
  group: link-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tauri's Linux build dependencies: the webview, the tray, icons and menus.
  LINUX_PACKAGES: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

jobs:
  check:
    name: Check and test (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: link/src-tauri

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Tauri's Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES

      - name: Install the pinned Rust toolchain
        # Reads link/rust-toolchain.toml.
        run: rustup toolchain install

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: link/src-tauri

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  installer-script:
    name: Installer script
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint
        run: shellcheck link/install.sh

      # Debian's /bin/sh is dash, the shell `curl ... | sh` runs the script with on Debian and Ubuntu.
      - name: Test with stand-ins for the system commands
        run: python3 -m unittest discover --start-directory link/tests --pattern 'test_*.py' -v

  installers:
    name: Installers (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            runner: macos-latest
            artifact: poise-link-macos
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows
            runner: windows-latest
            artifact: poise-link-windows
            args: --bundles msi,nsis
          - name: Linux
            # The oldest supported Ubuntu, so the package runs on every newer release.
            runner: ubuntu-22.04
            artifact: poise-link-linux
            args: --bundles deb,appimage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: link/package-lock.json

      - name: Install Tauri's Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES

      - name: Install the pinned Rust toolchain
        working-directory: link
        shell: bash
        run: |
          rustup toolchain install
          if [ -n "${{ matrix.rust-targets }}" ]; then rustup target add ${{ matrix.rust-targets }}; fi

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: link/src-tauri

      - name: Install the Tauri CLI
        working-directory: link
        run: npm ci

      # Not code-signed yet; the macOS app carries an ad-hoc signature.
      - name: Build installers
        working-directory: link
        shell: bash
        run: npm run tauri build -- ${{ matrix.args }}

      # The names install.sh and the release use, without the version.
      - name: Collect installers
        shell: bash
        run: |
          set -eu
          bundle=link/src-tauri/target/release/bundle
          mkdir dist
          case "$RUNNER_OS" in
          macOS)
            cp link/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/Poise-Link-macos-universal.dmg
            ;;
          Linux)
            cp "$bundle"/deb/*.deb dist/Poise-Link-linux-amd64.deb
            cp "$bundle"/appimage/*.AppImage dist/Poise-Link-linux-amd64.AppImage
            ;;
          Windows)
            cp "$bundle"/nsis/*-setup.exe dist/Poise-Link-windows-x64-setup.exe
            cp "$bundle"/msi/*.msi dist/Poise-Link-windows-x64.msi
            ;;
          esac
          ls -l dist

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  # The installer, run for real on fresh machines against the installers just built.
  install-macos:
    name: Install on macOS (${{ matrix.name }})
    needs: installers
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple silicon
            runner: macos-latest
          - name: Intel
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      POISE_LINK_DOWNLOAD_BASE: file://${{ github.workspace }}/dist
      # Nobody is there to finish Espanso's setup window.
      POISE_LINK_ESPANSO_WAIT: '0'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download the installers
        uses: actions/download-artifact@v4
        with:
          name: poise-link-macos
          path: dist

      - name: Write the release's checksums
        working-directory: dist
        run: shasum -a 256 -- * > SHA256SUMS

      - name: Install Poise Link and Espanso
        run: sh link/install.sh

      - name: Check the installed apps
        run: |
          set -eu
          app="/Applications/Poise Link.app"
          codesign --verify --deep --strict "$app"
          if xattr -p com.apple.quarantine "$app" 2>/dev/null; then
            echo "::error::Poise Link is quarantined, so Gatekeeper would stop it"
            exit 1
          fi
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /Applications/Espanso.app/Contents/Info.plist)" = 2.4.1
          codesign --verify --deep --strict /Applications/Espanso.app
          for _ in $(seq 30); do pgrep -x poise-link >/dev/null && break; sleep 1; done
          sleep 5
          pid=$(pgrep -x poise-link) || { echo "::error::Poise Link is not running"; exit 1; }
          pgrep -x espanso >/dev/null || { echo "::error::Espanso is not running"; exit 1; }
          echo "FIRST_PID=$pid" >> "$GITHUB_ENV"

      # What a person sees after installing: Espanso's setup and Poise Link's pairing window.
      - name: Capture the screen
        continue-on-error: true
        run: screencapture -x first-run.png

      - name: Run the installer again, as an update
        run: sh link/install.sh

      - name: Check that Poise Link was replaced and restarted
        run: |
          set -eu
          for _ in $(seq 30); do pgrep -x poise-link >/dev/null && break; sleep 1; done
          sleep 5
          pid=$(pgrep -x poise-link) || { echo "::error::Poise Link is not running after the update"; exit 1; }
          test "$pid" != "$FIRST_PID" || { echo "::error::Poise Link was not restarted"; exit 1; }
          codesign --verify --deep --strict "/Applications/Poise Link.app"

      - name: Upload the screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-screen-macos-${{ matrix.runner }}
          path: first-run.png
          if-no-files-found: ignore

  install-ubuntu:
    name: Install on Ubuntu ${{ matrix.ubuntu }}
    needs: installers
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 20
    env:
      POISE_LINK_DOWNLOAD_BASE: file://${{ github.workspace }}/dist
      POISE_LINK_ESPANSO_WAIT: '0'
      DISPLAY: ':99'
      XDG_SESSION_TYPE: x11

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download the installers
        uses: actions/download-artifact@v4
        with:
          name: poise-link-linux
          path: dist

      - name: Write the release's checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      # What a desktop login provides: a display, and a systemd user manager with its session bus.
      - name: Start a display and a systemd user session
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          sudo loginctl enable-linger "$USER"
          runtime=/run/user/$(id -u)
          for _ in $(seq 30); do [ -S "$runtime/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime/bus" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR=$runtime systemctl --user import-environment DISPLAY

      - name: Install Poise Link and Espanso
        run: sh link/install.sh

      - name: Check the installed packages
        run: |
          set -eu
          dpkg-query --show poise-link espanso
          if ldd /usr/bin/poise-link | grep 'not found'; then exit 1; fi
          espanso --version | grep -F 2.4.1
          systemctl --user is-enabled espanso
          for _ in $(seq 30); do pgrep -x poise-link >/dev/null && break; sleep 1; done
          sleep 5
          pid=$(pgrep -x poise-link) || { echo "::error::Poise Link is not running"; exit 1; }
          echo "FIRST_PID=$pid" >> "$GITHUB_ENV"

      - name: Capture the screen
        continue-on-error: true
        run: import -window root first-run.png

      - name: Run the installer again, as an update
        run: sh link/install.sh

      - name: Check that Poise Link was restarted
        run: |
          set -eu
          for _ in $(seq 30); do pgrep -x poise-link >/dev/null && break; sleep 1; done
          sleep 5
          pid=$(pgrep -x poise-link) || { echo "::error::Poise Link is not running after the update"; exit 1; }
          test "$pid" != "$FIRST_PID" || { echo "::error::Poise Link was not restarted"; exit 1; }

      - name: Upload the screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-screen-ubuntu-${{ matrix.ubuntu }}
          path: first-run.png
          if-no-files-found: ignore

  install-debian:
    name: Install on Debian ${{ matrix.debian }}
    needs: installers
    strategy:
      fail-fast: false
      matrix:
        debian: ['12', '13']
    runs-on: ubuntu-24.04
    container: debian:${{ matrix.debian }}
    timeout-minutes: 20

    steps:
      # A fresh Debian with a person who may use sudo, as on a desktop. The
      # container has no display and no systemd, so Espanso is not started.
      - name: Add a person with sudo
        run: |
          apt-get update
          apt-get install -y --no-install-recommends sudo curl ca-certificates
          useradd --create-home person
          echo 'person ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/person

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download the installers
        uses: actions/download-artifact@v4
        with:
          name: poise-link-linux
          path: dist

      - name: Write the release's checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      - name: Install Poise Link and Espanso
        run: su person -c "POISE_LINK_DOWNLOAD_BASE=file://$PWD/dist POISE_LINK_ESPANSO_WAIT=0 POISE_LINK_SESSION=x11 sh $PWD/link/install.sh"

      - name: Check the installed packages
        run: |
          set -eu
          dpkg-query --show poise-link espanso
          if ldd /usr/bin/poise-link | grep 'not found'; then exit 1; fi
          su person -c 'espanso --version' | grep -F 2.4.1

      - name: Run the installer again, as an update
        run: su person -c "POISE_LINK_DOWNLOAD_BASE=file://$PWD/dist POISE_LINK_ESPANSO_WAIT=0 sh $PWD/link/install.sh"

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/link-v')
    needs: [check, installer-script, installers, install-macos, install-ubuntu, install-debian]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check that the tag names the app's version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' link/src-tauri/Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "link-v$version" ]; then
            echo "::error::$GITHUB_REF_NAME does not match link/src-tauri/Cargo.toml's version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Download the installers
        uses: actions/download-artifact@v4
        with:
          pattern: poise-link-*
          path: dist
          merge-multiple: true

      - name: Add the install script and the checksums
        working-directory: dist
        run: |
          cp ../link/install.sh install.sh
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=https://github.com/${{ github.repository }}/releases/latest/download/install.sh
          cat > notes.md <<EOF
          Install or update Poise Link, with Espanso when it is missing, on macOS or on Debian 12+ and Ubuntu 24.04+ (amd64):

          \`\`\`bash
          curl -fsSL $url | sh
          \`\`\`

          Without curl: \`wget -qO- $url | sh\`. On Windows, run \`Poise-Link-windows-x64-setup.exe\`. [Poise Link](https://github.com/${{ github.repository }}/blob/$GITHUB_SHA/docs/Poise-Link.md) explains each step.

          Built from $GITHUB_SHA. The installer installed these files on fresh macOS (Apple silicon and Intel), Ubuntu 24.04 and 26.04, and Debian 12 and 13 machines before this release was published. \`SHA256SUMS\` lists every file's checksum.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --title "Poise Link $VERSION" --notes-file notes.md --verify-tag --latest
