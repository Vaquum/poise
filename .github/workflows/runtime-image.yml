name: Runtime image

on:
  pull_request:
    paths:
      - "deploy/runtime/**"
      - "deploy/caller-guard/**"
      - "deploy/ci/test_caller_guard*.py"
      - "deploy/lib.sh"
      - ".dockerignore"
      - "package*.json"
      - "server/**"
      - "src/**"
      - "scripts/**"
      - "caller/**"
      - ".github/workflows/runtime-image.yml"
  push:
    branches: [main]
    paths:
      - "deploy/runtime/**"
      - "deploy/caller-guard/**"
      - "deploy/ci/test_caller_guard*.py"
      - "deploy/lib.sh"
      - ".dockerignore"
      - "package*.json"
      - "server/**"
      - "src/**"
      - "scripts/**"
      - "caller/**"
      - ".github/workflows/runtime-image.yml"

permissions:
  contents: read

concurrency:
  group: runtime-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Workspace image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint the image's shell scripts
        run: shellcheck deploy/runtime/*.sh deploy/runtime/test/*.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/runtime/Dockerfile
          tags: poise-runtime:ci
          load: true
          # A release and base, as deploy/lib.sh names them, for the switch smoke test.
          build-args: |
            POISE_RELEASE=ci-${{ github.sha }}
            POISE_BASE=ci
          cache-from: type=gha,scope=runtime-image
          cache-to: type=gha,scope=runtime-image,mode=max

      - name: Print the image size
        run: |
          docker image ls poise-runtime:ci
          size=$(docker image inspect --format '{{.Size}}' poise-runtime:ci)
          echo "poise-runtime:ci is $((size / 1000000)) MB" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check identity, user, tools and entrypoint
        run: deploy/runtime/test/smoke.sh contract poise-runtime:ci

      - name: Check that a failed CLI bootstrap leaves Poise running
        run: deploy/runtime/test/smoke.sh offline poise-runtime:ci

      - name: Check that a release switch restarts Poise alone
        run: deploy/runtime/test/smoke.sh switch poise-runtime:ci

      - name: Check v2 refusal under the default Docker security profile
        run: deploy/runtime/test/native-cleanup.sh poise-runtime:ci runc

      # Only this disposable CI runner is configured. v1 keeps its existing
      # runtime contract; no deployment defaults or production hosts change.
      - name: Install the pinned namespace-capable test runtime
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/gvisor.tar.bz2" \
            https://github.com/google/gvisor/releases/download/release-20261026.0/gvisor-x86_64.tar.bz2
          echo "096589d2d6078ba4caa26aa0200932f571aa5da9d08a5156b98ab1d93fa54468  $RUNNER_TEMP/gvisor.tar.bz2" | sha256sum --check
          sudo mkdir -p /usr/local/lib/poise-gvisor
          sudo tar -xjf "$RUNNER_TEMP/gvisor.tar.bz2" -C /usr/local/lib/poise-gvisor
          sudo /usr/local/lib/poise-gvisor/runsc install --runtime=runsc -- --platform=systrap
          sudo systemctl reload docker
          /usr/local/lib/poise-gvisor/runsc --version

      - name: Check native namespace teardown and Caller resource receipts in the actual image
        run: deploy/runtime/test/native-cleanup.sh poise-runtime:ci runsc

      - name: Prove the host Caller fence with actual gVisor and runc workspaces
        run: sudo env POISE_GUARD_IMAGE=poise-runtime:ci python3 -m unittest discover --start-directory deploy/ci --pattern 'test_caller_guard_docker.py' --verbose

      # Installing the provider CLIs downloads about a gigabyte from five
      # vendors, so it runs only when the image's own files change.
      - name: Check whether the image's own files changed
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          if git diff --quiet FETCH_HEAD HEAD -- deploy/runtime .github/workflows/runtime-image.yml; then
            echo "runtime=false" >> "$GITHUB_OUTPUT"
          else
            echo "runtime=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the provider CLIs
        if: steps.changes.outputs.runtime == 'true'
        run: deploy/runtime/test/smoke.sh bootstrap poise-runtime:ci

      - name: Print the containers' logs
        if: failure()
        run: deploy/runtime/test/smoke.sh logs poise-runtime:ci
