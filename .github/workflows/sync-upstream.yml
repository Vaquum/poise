# Keeps a fork of autonomio/poise in step with it (docs/Operating.md, "Run
# your own Poise from a fork"). Opt in with the repository variable
# POISE_UPSTREAM_SYNC=true. Every five minutes, GitHub's shortest schedule, it
# merges autonomio/poise's main into this repository's main, as the Sync fork
# button does. Deployment-enabled forks hold their tip through CI and Deploy,
# then coalesce waiting upstream changes into the next candidate.
# Deploy completion wakes Sync to advance a held merge or recover a failure.
#
# GitHub lets the workflow's own token change no workflow file. When
# autonomio/poise changes one, the merge fails until the fork is synced by
# hand, or the repository gives this workflow a POISE_SYNC_TOKEN secret: a
# fine-grained token with read and write access to this repository's contents
# and workflows.
name: Sync with autonomio/poise

on:
  schedule:
    # Off the top of the hour, when GitHub's scheduler is busiest.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  observe:
    name: Observe the production release
    needs: sync
    if: always() && vars.POISE_DEPLOY_HOST != '' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up observation SSH
        id: ssh
        continue-on-error: true
        env:
          POISE_DEPLOY_HOST: ${{ vars.POISE_DEPLOY_HOST }}
          POISE_DEPLOY_USER: ${{ vars.POISE_DEPLOY_USER }}
          POISE_DEPLOY_PORT: ${{ vars.POISE_DEPLOY_PORT }}
          POISE_DEPLOY_JUMP: ${{ vars.POISE_DEPLOY_JUMP }}
          POISE_DEPLOY_KNOWN_HOSTS: ${{ vars.POISE_DEPLOY_KNOWN_HOSTS }}
          POISE_DEPLOY_SSH_KEY: ${{ secrets.POISE_DEPLOY_SSH_KEY }}
        run: deploy/actions/ssh-setup.sh
      - name: Reconcile pending workspace proof
        if: steps.ssh.outcome == 'success'
        continue-on-error: true
        env:
          DEPLOY_PATH: ${{ vars.POISE_DEPLOY_PATH || '/srv/poise' }}
        run: deploy/actions/verify.sh
      - name: Diagnose release lag without deploying
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          UPSTREAM_SYNC: ${{ vars.POISE_UPSTREAM_SYNC }}
          DEPLOY_PATH: ${{ vars.POISE_DEPLOY_PATH || '/srv/poise' }}
          POISE_RELEASE_REPORT_REPOSITORY: ${{ vars.POISE_RELEASE_REPORT_REPOSITORY }}
          POISE_RELEASE_REPORT_TOKEN: ${{ secrets.POISE_RELEASE_REPORT_TOKEN }}
        run: python3 deploy/release-status.py

  sync:
    name: Merge autonomio/poise's main
    if: >-
      vars.POISE_UPSTREAM_SYNC == 'true'
      || (vars.POISE_DEPLOY_HOST != '' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Retain the deployment candidate through verification and Deploy
        id: gate
        if: vars.POISE_DEPLOY_HOST != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SUCCESSFUL_DEPLOY_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.id || '' }}
        run: deploy/actions/sync-gate.sh

      - name: Merge autonomio/poise's main into main
        id: merge
        if: vars.POISE_UPSTREAM_SYNC == 'true' && (vars.POISE_DEPLOY_HOST == '' || steps.gate.outputs.proceed == 'true')
        env:
          GH_TOKEN: ${{ secrets.POISE_SYNC_TOKEN || github.token }}
          WORKFLOW_TOKEN_ONLY: ${{ secrets.POISE_SYNC_TOKEN == '' }}
          WORKFLOW_TOKEN: ${{ github.token }}
          PREVIOUS_SHA: ${{ steps.gate.outputs.sha }}
        run: |
          if ! result=$(gh api --method POST "repos/$GITHUB_REPOSITORY/merge-upstream" --field branch=main 2>&1); then
            echo "::error::Merging autonomio/poise's main failed: $result"
            echo "A conflict needs merging by hand. A workflow file the token may not change needs Sync fork on the repository's page, or a POISE_SYNC_TOKEN secret (see this workflow's header)."
            exit 1
          fi
          jq --raw-output .message <<<"$result"
          if [ "$(jq --raw-output .merge_type <<<"$result")" = none ]; then
            echo 'unchanged=true' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$PREVIOUS_SHA" ]; then
            next=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
            printf '### Fork release superseded\n\n[%s](https://github.com/%s/commit/%s) → [%s](https://github.com/%s/commit/%s). Coalesced to the newest upstream tip; required CI must pass before deployment.\n' \
              "$PREVIOUS_SHA" "$GITHUB_REPOSITORY" "$PREVIOUS_SHA" "$next" "$GITHUB_REPOSITORY" "$next" >>"$GITHUB_STEP_SUMMARY"
          fi
          # A push made with the workflow's own token starts no workflow, so start the deployment here.
          if [ "$WORKFLOW_TOKEN_ONLY" = true ]; then
            GH_TOKEN=$WORKFLOW_TOKEN gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "Started the Deploy workflow for the merged main."
          fi

      - name: Retry the failed stage for the unchanged candidate
        if: steps.gate.outputs.retry != '' && (steps.merge.outputs.unchanged == 'true' || vars.POISE_UPSTREAM_SYNC != 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.gate.outputs.sha }}
          RUN_ID: ${{ steps.gate.outputs.retry }}
        run: deploy/actions/retry.sh
