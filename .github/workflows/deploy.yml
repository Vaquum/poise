# Deploys a fork of autonomio/poise to its own server (docs/Operating.md,
# "Run your own Poise from a fork"). It does nothing in a repository that
# sets no POISE_DEPLOY_HOST variable, so autonomio/poise deploys nowhere.
#
# It deploys only a commit whose required CI passed on that exact commit:
# every CI and Caller completion re-evaluates the gate in
# deploy/actions/gate.sh, which refuses anything but the tip of main with
# both workflows green on it. A run started by hand checks the same gate,
# so applying settings needs green CI on the tip too. Deploys therefore
# land once CI passes, about ten to twenty minutes after the push, and a
# commit CI never tested never deploys.
name: Deploy

on:
  workflow_run:
    workflows: [CI, Caller]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to the server
    if: >
      vars.POISE_DEPLOY_HOST != '' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the commit CI tested
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Refuse any SHA whose required CI did not pass on it
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          TRIGGER: ${{ github.event_name }}
        run: deploy/actions/gate.sh

      - name: Set up SSH
        if: steps.gate.outputs.proceed == 'true'
        env:
          POISE_DEPLOY_HOST: ${{ vars.POISE_DEPLOY_HOST }}
          POISE_DEPLOY_USER: ${{ vars.POISE_DEPLOY_USER }}
          POISE_DEPLOY_PORT: ${{ vars.POISE_DEPLOY_PORT }}
          POISE_DEPLOY_JUMP: ${{ vars.POISE_DEPLOY_JUMP }}
          POISE_DEPLOY_KNOWN_HOSTS: ${{ vars.POISE_DEPLOY_KNOWN_HOSTS }}
          POISE_DEPLOY_SSH_KEY: ${{ secrets.POISE_DEPLOY_SSH_KEY }}
        run: deploy/actions/ssh-setup.sh

      - name: Deploy ${{ steps.gate.outputs.sha }}
        if: steps.gate.outputs.proceed == 'true'
        env:
          REPO: ${{ github.server_url }}/${{ github.repository }}.git
          SHA: ${{ steps.gate.outputs.sha }}
          DEPLOY_PATH: ${{ vars.POISE_DEPLOY_PATH || '/srv/poise' }}
          TOKEN: ${{ github.token }}
          VARS: ${{ toJSON(vars) }}
          POISE_GITHUB_CLIENT_SECRET: ${{ secrets.POISE_GITHUB_CLIENT_SECRET }}
          POISE_GOOGLE_CLIENT_SECRET: ${{ secrets.POISE_GOOGLE_CLIENT_SECRET }}
        run: deploy/actions/deploy.sh
