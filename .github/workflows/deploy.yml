# Deploys a fork of autonomio/poise to its own server (docs/Operating.md,
# "Run your own Poise from a fork"). It does nothing in a repository that
# sets no POISE_DEPLOY_HOST variable, so autonomio/poise deploys nowhere.
#
# It deploys only the tip of main, and only once that exact commit's
# required CI passed on it: every CI and Caller completion wakes the
# workflow, and the gate in deploy/actions/gate.sh judges the current tip
# again, so a stale wake-up for an older SHA deploys the green tip instead
# of losing its deploy (and may redeploy it when nothing newer waits). A
# run started by hand checks the same gate, so applying settings needs
# green CI on the tip too. Deploys therefore land once CI passes, about
# ten to twenty minutes after the push, and a commit CI never tested never
# deploys.
name: Deploy

on:
  workflow_run:
    workflows: [CI, Caller]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to the server
    if: >
      vars.POISE_DEPLOY_HOST != '' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the tip for the gate scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Refuse any tip whose required CI did not pass on it
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TRIGGER: ${{ github.event_name }}
        run: deploy/actions/gate.sh

      - name: Check out the approved commit
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.sha }}

      - name: Set up SSH
        if: steps.gate.outputs.proceed == 'true'
        env:
          POISE_DEPLOY_HOST: ${{ vars.POISE_DEPLOY_HOST }}
          POISE_DEPLOY_USER: ${{ vars.POISE_DEPLOY_USER }}
          POISE_DEPLOY_PORT: ${{ vars.POISE_DEPLOY_PORT }}
          POISE_DEPLOY_JUMP: ${{ vars.POISE_DEPLOY_JUMP }}
          POISE_DEPLOY_KNOWN_HOSTS: ${{ vars.POISE_DEPLOY_KNOWN_HOSTS }}
          POISE_DEPLOY_SSH_KEY: ${{ secrets.POISE_DEPLOY_SSH_KEY }}
        run: deploy/actions/ssh-setup.sh

      - name: Deploy ${{ steps.gate.outputs.sha }}
        if: steps.gate.outputs.proceed == 'true'
        env:
          REPO: ${{ github.server_url }}/${{ github.repository }}.git
          SHA: ${{ steps.gate.outputs.sha }}
          DEPLOY_PATH: ${{ vars.POISE_DEPLOY_PATH || '/srv/poise' }}
          TOKEN: ${{ github.token }}
          VARS: ${{ toJSON(vars) }}
          POISE_GITHUB_CLIENT_SECRET: ${{ secrets.POISE_GITHUB_CLIENT_SECRET }}
          POISE_GOOGLE_CLIENT_SECRET: ${{ secrets.POISE_GOOGLE_CLIENT_SECRET }}
        run: deploy/actions/deploy.sh
