name: Caller

on:
  pull_request:
  merge_group:
    types: [checks_requested]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: caller-${{ github.ref }}
  cancel-in-progress: true

jobs:
  caller:
    name: Caller (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Fetch PR comparison base
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE"

      - name: Select Caller tests or reuse queue evidence
        id: plan
        run: node .github/ci.mjs plan caller.yml
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}

      - name: Set up Python
        if: steps.plan.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poise dependencies
        if: steps.plan.outputs.run == 'true'
        run: npm ci

      - name: Install Caller
        if: steps.plan.outputs.run == 'true'
        run: python -m pip install ./caller/agent_interface ./caller/github_interface ./caller/github_datastore pytest

      - name: Run Caller tests
        if: steps.plan.outputs.run == 'true'
        run: python -m pytest caller/agent_interface/tests caller/github_interface/tests caller/github_datastore/tests -q

      - name: Parse every Python file
        if: steps.plan.outputs.run == 'true'
        run: |
          python - <<'PY'
          import ast
          import subprocess

          files = subprocess.run(["git", "ls-files", "*.py"], check=True, capture_output=True, text=True).stdout.splitlines()
          for path in files:
              with open(path, encoding="utf-8") as source:
                  ast.parse(source.read(), filename=path)
          print(f"parsed {len(files)} Python files")
          PY

      - name: Check the CLI entry points
        if: steps.plan.outputs.run == 'true'
        run: |
          agent-interface --help
          github-interface --help
          github-datastore --help
