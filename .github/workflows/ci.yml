name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint, types & audit (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Typecheck client, server and tests
        run: npm run typecheck

  build:
    name: Production build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
          if-no-files-found: error
          retention-days: 1

  unit:
    name: Unit & integration (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Run unit and integration shard with timings
        run: npm test -- --shard=${{ matrix.shard }}/2 --reporter=default --reporter=json --outputFile=test-results/vitest.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: unit-timings-${{ matrix.shard }}
          path: test-results/vitest.json
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Browser Chromium (${{ matrix.shard }}/4)
    needs: build
    runs-on: ubuntu-latest
    # Worst observed 2026-10-22: ~11 min uncached Playwright install (slow apt
    # mirror) + ~8 min slowest all-pass shard; 25 leaves about a third headroom.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist/
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Each shard owns its server, databases and real-API fixtures.
      # One worker preserves the fixture contracts within a shard.
      - name: Run browser shard against the production build
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4 --workers=1
        env:
          POISE_E2E_PREBUILT: '1'
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/playwright.json
          if-no-files-found: error
          retention-days: 7

  verify:
    # Preserve the protected context and self-update contract.
    name: Verify (Node 22)
    if: ${{ always() }}
    needs: [static, build, unit, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every gate to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const results = JSON.parse(process.env.RESULTS); if (!Object.keys(results).length) throw new Error("No gate results"); for (const [gate, result] of Object.entries(results)) { console.log(gate + ": " + result.result); if (result.result !== "success") process.exitCode = 1 }'
