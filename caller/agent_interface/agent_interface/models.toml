# One row per identity: <family>-<version>-<effort>. The identity is the only
# name a model has anywhere in the system; selector and effort are what the
# provider CLI is handed. Kept current by `agent-interface --refresh-models`
# (latest model per family — Claude keeps Opus and Fable, Codex Astra and Sol —
# with its top efforts: three for Claude because governed PR work runs at high,
# two elsewhere), which writes the runtime copy under the data directory; this
# packaged file is the seed.
schema_version = 2

[models."opus-5-max"]
provider = "claude"
selector = "claude-opus-5"
effort = "max"

[models."opus-5-xhigh"]
provider = "claude"
selector = "claude-opus-5"
effort = "xhigh"

[models."opus-5-high"]
provider = "claude"
selector = "claude-opus-5"
effort = "high"

[models."fable-5.1-max"]
provider = "claude"
selector = "claude-fable-5-1"
effort = "max"

[models."fable-5.1-xhigh"]
provider = "claude"
selector = "claude-fable-5-1"
effort = "xhigh"

[models."fable-5.1-high"]
provider = "claude"
selector = "claude-fable-5-1"
effort = "high"

[models."gpt-6-astra-ultra"]
provider = "codex"
selector = "gpt-6-astra"
effort = "ultra"

[models."gpt-6-astra-max"]
provider = "codex"
selector = "gpt-6-astra"
effort = "max"

[models."gpt-5.6-sol-ultra"]
provider = "codex"
selector = "gpt-5.6-sol"
effort = "ultra"

[models."gpt-5.6-sol-max"]
provider = "codex"
selector = "gpt-5.6-sol"
effort = "max"

[models."grok-4.6-xhigh"]
provider = "grok"
selector = "grok-4.6"
effort = "xhigh"

[models."grok-4.6-high"]
provider = "grok"
selector = "grok-4.6"
effort = "high"

[models."gemini-3.8-flash-high"]
provider = "antigravity"
selector = "gemini-3.8-flash"
effort = "high"

[models."gemini-3.8-flash-medium"]
provider = "antigravity"
selector = "gemini-3.8-flash"
effort = "medium"

[models."muse-spark-1.3-contributor-max"]
provider = "muse"
selector = "muse-spark-1.3-contributor"
effort = "max"

[models."muse-spark-1.3-contributor-xhigh"]
provider = "muse"
selector = "muse-spark-1.3-contributor"
effort = "xhigh"

[behaviors]
pr_review = "opus-5-high"
pr_approve = "opus-5-high"
review_recovery = "gpt-6-astra-ultra"
fix_failing_ci = "opus-5-max"
issue_simplify = "opus-5-max"
author_content = "opus-5-max"
debate_moderator = "opus-5-max"
debate_participants = ["opus-5-max", "gpt-6-astra-ultra", "grok-4.6-xhigh", "gemini-3.8-flash-high", "muse-spark-1.3-contributor-max"]
